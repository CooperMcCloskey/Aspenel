[package]
name = "aspenel"
version = "0.1.0"
description = "A lightweight task managing app"
authors = ["Cooper McCloskey"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "aspenel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = {version =  "1", features = ["serde"] }
thiserror = "1.0"
tauri-plugin-dialog = "2"
chrono = { version = "0.4.44", features = ["serde", "clock"] }
specta = { version = "=2.0.0-rc.25", features = ["ulid", "chrono", "collect"] } 
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-serde = "0.0.12"
